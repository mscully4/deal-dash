[project]
name = "deal-dash"
version = "0.1.0"
description = "CLI tool to fetch clearance deals from rebelsavings.com"
authors = [
    {name = "Mike", email = "catplusmike@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.44",
    "click>=8.1",
    "zipcodes>=1.2",
    "pydantic>=2.0",
    "boto3>=1.34",
]

[project.scripts]
deal-dash = "deal_dash.main:cli"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100
fix = true
show-fixes = true

lint.select = [
    "F",
    "E",
    "I",
    "W",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["deal_dash"]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = "deal_dash.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["zipcodes.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.9",
    "mypy>=1.19",
]
